<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" fill="#0b1329"/>
  <!-- Grid -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <circle cx="300" cy="180" r="140"/>
    <circle cx="300" cy="180" r="100"/>
    <circle cx="300" cy="180" r="60"/>
  </g>
  <!-- Cluster Topology Nodes -->
  <line x1="300" y1="180" x2="200" y2="100" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="300" y1="180" x2="400" y2="100" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="300" y1="180" x2="180" y2="240" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="180" x2="420" y2="240" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="180" x2="300" y2="290" stroke="#10b981" stroke-width="2"/>

  <!-- Master Node -->
  <rect x="260" y="150" width="80" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="272" y="178" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">K8s Core</text>
  <text x="278" y="196" fill="#38bdf8" font-family="monospace" font-size="10">v1.31-TLS</text>

  <!-- Worker Nodes -->
  <rect x="150" y="70" width="100" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="165" y="94" fill="#cbd5e1" font-family="sans-serif" font-size="11">Worker-US-1</text>
  <text x="165" y="106" fill="#10b981" font-family="monospace" font-size="9">● Ready (eBPF)</text>

  <rect x="350" y="70" width="100" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="365" y="94" fill="#cbd5e1" font-family="sans-serif" font-size="11">Worker-EU-1</text>
  <text x="365" y="106" fill="#10b981" font-family="monospace" font-size="9">● Ready (eBPF)</text>

  <rect x="130" y="220" width="100" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="145" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="11">Worker-IN-1</text>
  <text x="145" y="256" fill="#10b981" font-family="monospace" font-size="9">● Ready (eBPF)</text>

  <rect x="370" y="220" width="100" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="385" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="11">Worker-SG-1</text>
  <text x="385" y="256" fill="#10b981" font-family="monospace" font-size="9">● Ready (eBPF)</text>

  <rect x="250" y="270" width="100" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="268" y="292" fill="#c7d2fe" font-family="sans-serif" font-size="11">ArgoCD Sync</text>
  <text x="272" y="303" fill="#a5b4fc" font-family="monospace" font-size="9">Zero-Downtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" fill="#0f172a"/>
  <!-- Circular Strategy Compass -->
  <g transform="translate(180, 180)">
    <circle r="120" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="80" stroke="#475569" stroke-width="1.5"/>
    <circle r="40" stroke="#2563eb" stroke-width="2"/>
    <circle r="6" fill="#38bdf8"/>
    <!-- Compass Crosshairs -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#475569" stroke-width="1"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#475569" stroke-width="1"/>
    <polygon points="0,-75 10,-20 -10,-20" fill="#2563eb"/>
    <polygon points="0,75 10,20 -10,20" fill="#64748b"/>
  </g>
  <!-- DORA Metrics strip -->
  <g transform="translate(360, 70)">
    <rect width="190" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">DEPLOYMENT FREQUENCY</text>
    <text x="16" y="42" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">On-Demand (Daily)</text>
  </g>
  <g transform="translate(360, 140)">
    <rect width="190" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">LEAD TIME FOR CHANGES</text>
    <text x="16" y="42" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">&lt; 3.5 Hours</text>
  </g>
  <g transform="translate(360, 210)">
    <rect width="190" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">CHANGE FAILURE RATE</text>
    <text x="16" y="42" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">&lt; 2.1% (Elite)</text>
  </g>
</svg>

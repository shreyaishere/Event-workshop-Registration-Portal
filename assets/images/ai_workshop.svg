<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" fill="#080c14"/>
  <!-- AI Agent Node Graph -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
    <line x1="120" y1="180" x2="260" y2="100"/>
    <line x1="120" y1="180" x2="260" y2="260"/>
    <line x1="260" y1="100" x2="420" y2="100"/>
    <line x1="260" y1="260" x2="420" y2="260"/>
    <line x1="260" y1="100" x2="420" y2="260"/>
    <line x1="260" y1="260" x2="420" y2="100"/>
    <line x1="420" y1="100" x2="520" y2="180"/>
    <line x1="420" y1="260" x2="520" y2="180"/>
  </g>
  <!-- Node Circles -->
  <circle cx="120" cy="180" r="28" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="185" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">User</text>

  <circle cx="260" cy="100" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="245" y="105" fill="#bae6fd" font-family="sans-serif" font-size="10">Router</text>

  <circle cx="260" cy="260" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="246" y="265" fill="#bae6fd" font-family="sans-serif" font-size="10">Vector</text>

  <circle cx="420" cy="100" r="24" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="403" y="105" fill="#e9d5ff" font-family="sans-serif" font-size="10">Reason</text>

  <circle cx="420" cy="260" r="24" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="408" y="265" fill="#a7f3d0" font-family="sans-serif" font-size="10">Tools</text>

  <circle cx="520" cy="180" r="28" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="502" y="185" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Output</text>
  
  <rect x="230" y="30" width="140" height="28" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="248" y="48" fill="#c7d2fe" font-family="monospace" font-size="10">AGENTIC LOOP v3.0</text>

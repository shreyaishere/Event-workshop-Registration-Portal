<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="280" y1="0" x2="280" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="440" y1="0" x2="440" y2="360"/>
    <line x1="520" y1="0" x2="520" y2="360"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>

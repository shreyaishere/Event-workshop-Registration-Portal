  <circle cx="360" cy="200" r="5" fill="#2563eb"/>
  <circle cx="440" cy="160" r="5" fill="#10b981"/>
  <!-- Metrics badges in visual -->
  <rect x="360" y="80" width="180" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="380" y="102" fill="#94a3b8" font-family="monospace" font-size="11">LCP TARGET &lt; 1.2s</text>
  <text x="380" y="118" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">98.4% PASS (GREEN)</text>
  <rect x="360" y="230" width="180" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="380" y="252" fill="#94a3b8" font-family="monospace" font-size="11">INP EXECUTION</text>
  <text x="380" y="268" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">42ms BUDGET</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" fill="#0f172a"/>
  <!-- Design System Grid & Component cards -->
  <g opacity="0.1" stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>
  <!-- Color Swatches Row -->
  <rect x="70" y="45" width="45" height="45" rx="8" fill="#2563eb"/>
  <rect x="125" y="45" width="45" height="45" rx="8" fill="#0d9488"/>
  <rect x="180" y="45" width="45" height="45" rx="8" fill="#475569"/>
  <rect x="235" y="45" width="45" height="45" rx="8" fill="#f8fafc"/>
  <text x="70" y="112" fill="#94a3b8" font-family="monospace" font-size="11">tokens.color.brand</text>

  <!-- Spec UI Component -->
  <rect x="70" y="140" width="220" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="90" y="160" width="120" height="12" rx="4" fill="#38bdf8"/>
  <rect x="90" y="182" width="180" height="8" rx="3" fill="#64748b"/>
  <rect x="90" y="196" width="150" height="8" rx="3" fill="#475569"/>
  <rect x="90" y="225" width="90" height="32" rx="6" fill="#2563eb"/>
  <text x="114" y="246" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Action</text>
  <rect x="190" y="225" width="80" height="32" rx="6" fill="transparent" stroke="#64748b" stroke-width="1.5"/>
  <text x="214" y="246" fill="#94a3b8" font-family="sans-serif" font-size="12">Cancel</text>

  <!-- Spacing / Radius Annotations -->
  <rect x="330" y="90" width="200" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="350" y="125" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Spatial Hierarchy</text>
  <text x="350" y="150" fill="#38bdf8" font-family="monospace" font-size="11">padding: var(--space-6)</text>
  <text x="350" y="170" fill="#38bdf8" font-family="monospace" font-size="11">radius: var(--radius-lg)</text>
  <text x="350" y="190" fill="#38bdf8" font-family="monospace" font-size="11">contrast: 7.2:1 (AAA)</text>
  <circle cx="360" cy="230" r="16" fill="#0d9488"/>
  <text x="385" y="235" fill="#5eead4" font-family="sans-serif" font-size="12">WCAG AA Verified</text>
</svg>
